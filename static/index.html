<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crunchyroll Remote</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cr: {
              orange: '#f47521',
              hover: '#ff8c3a',
              dark: '#141519',
              card: '#23252b'
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-press:active {
      transform: scale(0.95);
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: #282b33;
      height: 8px;
      border-radius: 9999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f47521;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(244, 117, 33, 0.6);
      border: 2.5px solid #ffffff;
    }
    input[type=range]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f47521;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(244, 117, 33, 0.6);
      border: 2.5px solid #ffffff;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between p-6 select-none bg-gradient-to-b from-slate-950 via-[#141519] to-slate-950">

  <!-- Header & Status Bar -->
  <header class="flex flex-col gap-2 pb-2 border-b border-slate-800/80">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <!-- Crunchyroll orange logo accent -->
        <div class="w-7 h-7 rounded-lg bg-cr-orange flex items-center justify-center font-black text-slate-950 text-base shadow-lg shadow-orange-500/20">
          CR
        </div>
        <h1 class="text-lg font-bold tracking-tight text-white">Remote Control</h1>
      </div>

      <!-- Status Badge -->
      <div id="status-container" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-400 transition-all duration-300">
        <span id="status-indicator" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="status-text">Conectando...</span>
      </div>
    </div>

    <!-- Quick utility bar: Wake Lock indicator / toggle -->
    <div class="flex items-center justify-end">
      <button id="btn-wakelock" type="button" class="btn-press flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-400 transition-all">
        <span id="wakelock-dot" class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
        <span id="wakelock-label">Pantalla</span>
      </button>
    </div>
  </header>

  <!-- Main Remote Control Grid -->
  <main class="flex-1 flex flex-col justify-center items-center gap-5 my-auto max-w-sm mx-auto w-full py-4">
    
    <!-- Primary Big Play/Pause Button -->
    <div class="w-full flex justify-center">
      <button id="btn-toggle-play" 
              class="btn-press group relative w-44 h-44 rounded-full bg-gradient-to-tr from-cr-orange to-amber-400 p-1 shadow-2xl shadow-orange-500/30 transition-all duration-200 flex items-center justify-center">
        <div class="w-full h-full rounded-full bg-cr-dark/80 backdrop-blur-sm group-active:bg-cr-dark/60 flex flex-col items-center justify-center gap-2 border border-orange-400/40">
          <!-- Play / Pause Icon -->
          <svg id="icon-play" class="w-16 h-16 text-cr-orange drop-shadow-md ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="icon-pause" class="w-16 h-16 text-cr-orange drop-shadow-md hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span class="text-xs uppercase tracking-widest font-extrabold text-slate-300">Play / Pause</span>
        </div>
      </button>
    </div>

    <!-- Quick Seek Row (-10s / +10s) -->
    <div class="grid grid-cols-2 gap-4 w-full">
      <button id="btn-rewind" 
              class="btn-press flex items-center justify-center gap-2 py-3.5 px-5 rounded-2xl bg-cr-card/80 border border-slate-800 hover:border-slate-700 text-slate-200 font-bold shadow-lg transition-all duration-150">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span>-10s</span>
      </button>

      <button id="btn-forward" 
              class="btn-press flex items-center justify-center gap-2 py-3.5 px-5 rounded-2xl bg-cr-card/80 border border-slate-800 hover:border-slate-700 text-slate-200 font-bold shadow-lg transition-all duration-150">
        <span>+10s</span>
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- Volume Control Slider Card -->
    <div class="w-full bg-cr-card/90 border border-slate-800/90 rounded-2xl p-4 shadow-xl flex flex-col gap-2.5">
      <div class="flex items-center justify-between text-xs font-semibold text-slate-300">
        <button id="btn-mute" class="flex items-center gap-1.5 hover:text-cr-orange transition-colors">
          <svg id="icon-volume-high" class="w-4 h-4 text-cr-orange" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
          <svg id="icon-volume-mute" class="w-4 h-4 text-rose-400 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l4-4m0 4l-4-4"/>
          </svg>
          <span>Volumen</span>
        </button>
        <span id="volume-label" class="text-xs font-bold text-cr-orange px-2 py-0.5 rounded-md bg-slate-900 border border-slate-800">100%</span>
      </div>
      <div class="flex items-center gap-3">
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
        <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-full cursor-pointer accent-[#f47521]">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
      </div>
    </div>

    <!-- Secondary Actions (Next Episode & Skip Intro) -->
    <div class="grid grid-cols-2 gap-4 w-full">
      <button id="btn-skip-intro" 
              class="btn-press flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl bg-cr-card/80 border border-slate-800 hover:border-slate-700 text-slate-200 font-bold shadow-lg transition-all duration-150">
        <svg class="w-5 h-5 text-cr-orange" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
        <span class="text-sm">Saltar Intro</span>
      </button>

      <button id="btn-next-episode" 
              class="btn-press flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-cr-card to-slate-900 border border-orange-500/40 text-orange-400 font-bold shadow-lg transition-all duration-150">
        <span class="text-sm">Siguiente</span>
        <svg class="w-5 h-5 text-cr-orange" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button id="btn-fullscreen" 
            class="btn-press w-full py-3.5 px-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-slate-400 font-medium text-xs flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
      </svg>
      <span>Alternar Pantalla Completa</span>
    </button>
  </main>

  <!-- Footer Info -->
  <footer class="text-center text-slate-500 text-xs py-2">
    <p>Conectado a Crunchyroll Player vía WebSocket</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
